services:
  - type: web
    name: htep-backend
    env: docker
    # The OCR stack peaks at ~650 MB, more than the free plan's 512 MB
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: OCR_ENGINE
        value: rapid
      - key: VLM_MODE
        value: "off"
